<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Under Construction</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }

  .container {
    max-width: 600px;
  }

  .icon {
    font-size: 5rem;
    margin-bottom: 20px;
    animation: spin 4s linear infinite;
    display: inline-block;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  h1 {
    font-size: 2.2rem;
    margin-bottom: 15px;
    letter-spacing: 1px;
  }

  p {
    font-size: 1.1rem;
    color: #d1d9e0;
    margin-bottom: 30px;
    line-height: 1.6;
  }

  .progress-bar {
    width: 100%;
    background: rgba(255,255,255,0.15);
    border-radius: 30px;
    overflow: hidden;
    height: 14px;
    margin-bottom: 30px;
  }

  .progress-fill {
    height: 100%;
    width: 65%;
    background: linear-gradient(90deg, #00c9ff, #92fe9d);
    border-radius: 30px;
  }

  .social {
    margin-bottom: 40px;
  }

  .social a {
    color: #fff;
    text-decoration: none;
    margin: 0 10px;
    font-size: 0.95rem;
    border: 1px solid rgba(255,255,255,0.3);
    padding: 8px 16px;
    border-radius: 20px;
    transition: 0.3s;
  }

  .social a:hover {
    background: rgba(255,255,255,0.15);
  }

  footer {
    position: fixed;
    bottom: 15px;
    width: 100%;
    text-align: center;
    font-size: 0.9rem;
    color: rgba(255,255,255,0.6);
  }

  footer span {
    color: #92fe9d;
    font-weight: 600;
  }
</style>
</head>
<body>

  <div class="container">
    <div class="icon">⚙️</div>
    <h1>Website Under Construction</h1>
    <p>Sorry for the inconvenience. We are working hard to bring you a better website. Please come back later!!</p>

    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>

    <div class="social">
      <a href="#">Facebook</a>
      <a href="#">Instagram</a>
      <a href="https://wa.link/avtcpe">WhatsApp</a>
    </div>
  </div>

  <footer>
    Designed by <span>Mr. Beda Issaya</span>
  </footer>

</body>
</html>
